<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>Ora Player Relay v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #slot, #slot > * { width: 100%; height: 100%; border: 0; border-radius: 12px; display: block; }
    </style>
</head>
<body>
    <div id="slot"></div>
    <script>
    // Relay v2 do Ora: toca YouTube e Spotify pelas APIs oficiais
    // (YouTube IFrame Player API e Spotify iFrame API) dentro de uma página
    // https, porque os embeds não aceitam uma página chrome-extension:// como origem.
    //
    // Protocolo (postMessage, sempre { oraRelay: 2, ... }):
    //   Ora → relay: { cmd: 'load', media: { source, type, id } } | 'play' | 'pause'
    //                | { cmd: 'volume', volume: 0–100 } | 'next'
    //   relay → Ora: { event: 'hello' } | { event: 'ready', id, canNext }
    //                | { event: 'state', id, paused } | { event: 'error', id, code }
    // Só conversa com a extensão que embutiu a página.
    (() => {
        const VERSION = 2;
        const parentOrigin = location.ancestorOrigins?.[0] || '';
        if (window.parent === window || !/^chrome-extension:\/\/[a-p]{32}$/.test(parentOrigin)) return;

        const slot = document.getElementById('slot');
        const SPOTIFY_TYPES = ['playlist', 'album', 'track'];
        let current = null;   // { media, player, paused, started, duration }
        let generation = 0;

        const post = (event, data = {}) => parent.postMessage({ oraRelay: VERSION, event, ...data }, parentOrigin);

        function valid(media) {
            if (!media || typeof media.id !== 'string') return false;
            if (media.source === 'spotify') return SPOTIFY_TYPES.includes(media.type) && /^[a-zA-Z0-9]+$/.test(media.id);
            if (media.source === 'youtube') {
                return media.type === 'video' ? /^[\w-]{11}$/.test(media.id) : media.type === 'playlist' && /^[\w-]+$/.test(media.id);
            }
            return false;
        }

        function script(src) {
            // Resolve quando a API chama o próprio callback; aqui só falha se o script não carregar.
            return new Promise((resolve, reject) => {
                const tag = document.createElement('script');
                tag.src = src;
                tag.onerror = () => reject(new Error('script ' + src));
                document.head.appendChild(tag);
            });
        }

        let youtubeApi = null;
        function loadYouTube() {
            return youtubeApi ||= new Promise((resolve, reject) => {
                if (window.YT?.Player) return resolve(window.YT);
                window.onYouTubeIframeAPIReady = () => resolve(window.YT);
                script('https://www.youtube.com/iframe_api').catch(error => { youtubeApi = null; reject(error); });
            });
        }

        let spotifyApi = null;
        function loadSpotify() {
            return spotifyApi ||= new Promise((resolve, reject) => {
                window.onSpotifyIframeApiReady = api => resolve(api);
                script('https://open.spotify.com/embed/iframe-api/v1').catch(error => { spotifyApi = null; reject(error); });
            });
        }

        function report(entry, paused) {
            if (entry !== current || entry.paused === paused) return;
            entry.paused = paused;
            if (!paused) entry.started = true;
            post('state', { id: entry.media.id, paused });
        }

        function fail(entry, code) {
            if (entry === current) post('error', { id: entry.media.id, code: String(code ?? '') });
        }

        function destroy() {
            const entry = current;
            current = null;
            try { entry?.player?.destroy(); } catch { /* o player já saiu */ }
            slot.replaceChildren();
        }

        async function load(media) {
            if (!valid(media)) return;
            destroy();
            const ticket = ++generation;
            const entry = current = { media, player: null, paused: true, started: false, duration: 0 };
            const target = document.createElement('div');
            slot.appendChild(target);
            const canNext = media.type !== 'video' && media.type !== 'track';
            try {
                if (media.source === 'youtube') {
                    const YT = await loadYouTube();
                    if (ticket !== generation) return;
                    const playerVars = { rel: 0, playsinline: 1, origin: location.origin };
                    if (media.type === 'playlist') Object.assign(playerVars, { listType: 'playlist', list: media.id });
                    entry.player = new YT.Player(target, {
                        host: 'https://www.youtube-nocookie.com',
                        width: '100%', height: '100%',
                        videoId: media.type === 'video' ? media.id : undefined,
                        playerVars,
                        events: {
                            onReady: () => entry === current && post('ready', { id: media.id, canNext }),
                            onStateChange: ({ data }) => {
                                if (data === 1 || data === 3) report(entry, false);
                                else if (data === 0 || data === 2 || data === 5) report(entry, true);
                            },
                            onError: ({ data }) => fail(entry, data)
                        }
                    });
                } else {
                    const api = await loadSpotify();
                    if (ticket !== generation) return;
                    api.createController(target, { uri: `spotify:${media.type}:${media.id}`, width: '100%', height: '100%' }, controller => {
                        if (entry !== current) { try { controller.destroy(); } catch { /* ok */ } return; }
                        entry.player = controller;
                        // A API cria o embed com loading="lazy", que pode nunca carregar
                        // num player pequeno ou oculto: força o carregamento.
                        const frame = controller.iframeElement;
                        frame?.removeAttribute('loading');
                        setTimeout(() => {
                            if (entry === current && !entry.ready && frame) frame.src = frame.src;
                        }, 1500);
                        controller.addListener('ready', () => {
                            if (entry === current && !entry.ready) {
                                entry.ready = true;
                                post('ready', { id: media.id, canNext });
                            }
                        });
                        controller.addListener('playback_started', () => report(entry, false));
                        controller.addListener('playback_update', ({ data }) => {
                            if (typeof data?.duration === 'number') entry.duration = data.duration;
                            if (typeof data?.isPaused === 'boolean') report(entry, data.isPaused);
                        });
                    });
                }
            } catch (error) {
                fail(entry, 'api');
            }
        }

        function play() {
            const entry = current;
            if (!entry?.player) return;
            if (entry.media.source === 'youtube') entry.player.playVideo?.();
            else if (entry.started) entry.player.resume();
            else entry.player.play();
        }

        function pause() {
            const entry = current;
            if (!entry?.player) return;
            if (entry.media.source === 'youtube') entry.player.pauseVideo?.();
            else entry.player.pause();
        }

        function next() {
            const entry = current;
            if (!entry?.player || entry.media.type === 'video' || entry.media.type === 'track') return;
            if (entry.media.source === 'youtube') entry.player.nextVideo?.();
            else {
                // A API do Spotify não tem "próxima": ir ao fim da faixa passa para a seguinte.
                entry.player.seek(entry.duration ? Math.max(0, entry.duration / 1000 - 0.2) : 1e9);
                setTimeout(() => entry === current && entry.player.resume(), 400);
            }
        }

        window.addEventListener('message', event => {
            if (event.source !== parent || event.origin !== parentOrigin) return;
            const data = event.data;
            if (data?.oraRelay !== VERSION) return;
            if (data.cmd === 'load') load(data.media);
            else if (data.cmd === 'play') play();
            else if (data.cmd === 'pause') pause();
            else if (data.cmd === 'next') next();
            else if (data.cmd === 'volume' && current?.media.source === 'youtube') {
                current.player?.setVolume?.(Math.min(100, Math.max(0, Number(data.volume) || 0)));
            }
        });

        post('hello');
        const params = new URLSearchParams(location.search);
        if (params.get('id')) load({ source: params.get('source'), type: params.get('type'), id: params.get('id') });
    })();
    </script>
</body>
</html>
